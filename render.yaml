services:
  - type: web
    name: vsit-cep-plastic-analytics
    env: node
    plan: free
    buildCommand: npm install && cd frontend && rm -rf node_modules package-lock.json && npm install && npm install @rolldown/binding-linux-x64-gnu && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: JWT_SECRET
        generateValue: true

